<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- نضبط اللغة والوضع قبل أول رسم عشان ما يحصل وميض -->
  <script>
    (function () {
      try {
        var l = localStorage.getItem("taza-lang") || "ar";
        var t = localStorage.getItem("taza-theme") ||
          (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        var d = document.documentElement;
        d.lang = l; d.dir = l === "ar" ? "rtl" : "ltr"; d.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = "light"; }
    })();
  </script>

  <title>TAZA 041 | المنيو</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="is-loading">

  <!-- ========== شاشة التحميل (Loader) ========== -->
  <div class="loader" id="loader" role="status" aria-live="polite" aria-label="جاري تحميل المنيو">
    <div class="loader__inner">

      <svg class="cloche" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" aria-hidden="true">
        <!-- الصحن -->
        <g id="plate">
          <ellipse cx="128" cy="200" rx="96" ry="18" fill="#FFF7E6" stroke="#1A1A1A" stroke-width="12" />
        </g>

        <!-- الغطاء والمقبض -->
        <g id="dome">
          <circle cx="128" cy="58" r="14" fill="#1A1A1A" />
          <path d="M 44 194 A 84 120 0 0 1 212 194 A 84 14 0 0 1 44 194 Z" fill="#FFF7E6" stroke="#1A1A1A" stroke-width="12" stroke-linejoin="round" />
          <path d="M 78 150 A 70 70 0 0 1 100 100" fill="none" stroke="#F29D38" stroke-width="12" stroke-linecap="round" />
        </g>
      </svg>

      <h1 class="loader__name">TAZA 041</h1>
      <p class="loader__tagline" dir="ltr">Love At First Bite!</p>

      <div class="loader__progress">
        <div class="loader__bar"><span class="loader__fill" id="loaderFill"></span></div>
        <span class="loader__percent" id="loaderPercent">0%</span>
      </div>

    </div>
  </div>

  <!-- ========== محتوى الصفحة ========== -->
  <main class="app" id="app">

    <!-- ========== الهيدر: الغلاف + اللوقو ========== -->
    <header class="header">
      <!-- أزرار الوضع واللغة (زاويتي الغلاف) -->
      <button class="ctl ctl--theme" id="themeBtn" type="button" aria-label="تفعيل الوضع الليلي">
        <span class="ctl__icon ctl__icon--moon" aria-hidden="true">🌙</span>
        <span class="ctl__icon ctl__icon--sun" aria-hidden="true">☀️</span>
      </button>
      <button class="ctl ctl--lang" id="langBtn" type="button" aria-label="Switch to English">
        <span id="langLabel">EN</span>
      </button>

      <div class="cover" aria-hidden="true">
        <div class="cover__pattern"></div>
      </div>

      <div class="brand">
        <div class="brand__shadow"></div>
        <img class="brand__logo" src="assets/images/logo.svg" alt="شعار مطعم TAZA 041">

        <!-- الشعار حول اللوقو (قوس علوي) -->
        <svg class="brand__ring" viewBox="0 0 300 300" role="img" aria-label="Love At First Bite!">
          <defs>
            <path id="tagline-arc" d="M 34 150 A 116 116 0 0 1 266 150" />
          </defs>
          <text class="brand__tagline" dir="ltr">
            <textPath href="#tagline-arc" startOffset="50%" text-anchor="middle">Love At First Bite!</textPath>
          </text>
        </svg>
      </div>
    </header>

    <!-- ========== شريط الأقسام المثبت + زر البحث ========== -->
    <div id="catSentinel" aria-hidden="true"></div>
    <nav class="catbar" id="catbar" aria-label="أقسام المنيو" hidden>
      <button class="catbar__logo" id="catLogo" type="button" aria-label="الرجوع للأعلى">
        <img src="assets/images/logo.svg" alt="">
      </button>
      <div class="catbar__track" id="catTrack">
        <div class="catbar__inner" id="catInner">
          <span class="catbar__pill" id="catPill" aria-hidden="true"></span>
        </div>
      </div>
      <button class="catbar__search-btn" id="searchToggle" type="button" aria-expanded="false" aria-controls="searchWrap" aria-label="بحث في المنيو">
        <svg class="search-btn__icon search-btn__icon--lens" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <svg class="search-btn__icon search-btn__icon--close" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </nav>

    <!-- ========== شريط البحث والاقتراحات (Jelly Pop Search) ========== -->
    <div class="search-wrap" id="searchWrap" hidden>
      <div class="search-bar" id="searchBar">
        <span class="search-bar__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </span>
        <input class="search-bar__input" id="searchInput" type="search" autocomplete="off" spellcheck="false" placeholder="ابحث عن وجبتك المفضلة...">
        <button class="search-bar__clear" id="searchClear" type="button" aria-label="مسح البحث" hidden>✕</button>
      </div>

      <!-- كبسولات اقتراحات سريعة (تظهر بحركة Jelly Pop) -->
      <div class="search-chips" id="searchChips"></div>

      <!-- قائمة نتائج واقتراحات الأطباق الفورية (كل عنصر يدخل بـ Jelly Wobble) -->
      <div class="search-suggestions" id="searchSuggestions" role="listbox" hidden></div>
    </div>

    <!-- ========== الأقسام والأطباق (تتعبى من menu.json) ========== -->
    <div class="menu" id="menu"></div>
  </main>

  <!-- ========== نافذة تفاصيل الطبق (Modal) ========== -->
  <div class="modal" id="dishModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="modal__backdrop" id="modalBackdrop"></div>

    <div class="modal__sheet" id="modalSheet">
      <div class="modal__handle" id="modalHandle" aria-hidden="true"><span></span></div>
      <button class="modal__close" id="modalClose" type="button" aria-label="إغلاق">✕</button>

      <div class="modal__content" id="modalContent">
        <div class="modal__media" id="modalMedia">
          <div class="modal__ph" aria-hidden="true">
            <span class="modal__ph-ring"></span>
            <span class="modal__ph-icon" id="modalIcon"></span>
          </div>
          <img class="modal__img" id="modalImg" alt="" hidden>
          <div class="modal__fade" aria-hidden="true"></div>
          <div class="modal__badges" id="modalBadges"></div>
        </div>

        <div class="modal__body">
          <div class="modal__cat" id="modalCat"></div>
          <h3 class="modal__title" id="modalTitle"></h3>

          <div class="modal__section">
            <h4 class="modal__subtitle" id="modalIngTitle">المكونات</h4>
            <p class="modal__desc" id="modalDesc"></p>
          </div>

          <div class="modal__allergens" id="modalAllergensBox" hidden>
            <h4 class="modal__subtitle modal__subtitle--warn">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
              <span id="modalAllergensTitle">مسببات الحساسية</span>
            </h4>
            <div class="modal__allergen-list" id="modalAllergensList"></div>
          </div>

          <div class="modal__footer">
            <div class="modal__price-box">
              <span class="modal__price-label" id="modalPriceLabel">السعر</span>
              <span class="modal__price" id="modalPrice"></span>
            </div>

            <div class="modal__nav">
              <button class="modal__step" id="modalPrev" type="button" aria-label="الطبق السابق">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
              </button>
              <span class="modal__counter" id="modalCounter"></span>
              <button class="modal__step" id="modalNext" type="button" aria-label="الطبق التالي">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
